name: Singapore Haze Dashboard

on:
  schedule:
    - cron: "5 * * * *"  # hourly, 5 minutes past the hour
  workflow_dispatch: {}   # allows manual trigger, incl. from the GitHub mobile app

permissions:
  contents: write

concurrency:
  group: haze-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest PM2.5 + PSI data
        run: python scripts/fetch_data.py

      - name: Build dashboard chart
        id: build_dashboard
        continue-on-error: true
        run: python scripts/build_dashboard.py

      - name: Build website (Folium map)
        id: build_map
        continue-on-error: true
        run: python scripts/build_map.py

      # A build step failing must never block committing data that fetch_data.py
      # already fetched successfully -- that data is real and shouldn't be
      # thrown away because e.g. a chart-rendering bug crashed afterward. So
      # build steps above are continue-on-error, we commit whatever files
      # exist here regardless, and only *afterward* does this job fail (below)
      # so the run still shows red and gets noticed.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/history.csv dashboard.png docs/index.html docs/.nojekyll; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update haze dashboard data [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push failed, retrying ($i)..."
            sleep $((i * 3))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

      - name: Fail job if a build step failed
        if: steps.build_dashboard.outcome == 'failure' || steps.build_map.outcome == 'failure'
        run: |
          echo "A build step failed (dashboard=${{ steps.build_dashboard.outcome }}, map=${{ steps.build_map.outcome }}); data was still committed above. See that step's log."
          exit 1
