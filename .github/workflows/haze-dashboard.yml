name: Singapore Haze Dashboard

on:
  schedule:
    - cron: "5 * * * *"  # hourly, 5 minutes past the hour
  workflow_dispatch: {}   # allows manual trigger, incl. from the GitHub mobile app

permissions:
  contents: write

concurrency:
  group: haze-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest PM2.5 + PSI data
        run: python scripts/fetch_data.py

      - name: Build dashboard chart
        run: python scripts/build_dashboard.py

      - name: Build website (Folium map)
        run: python scripts/build_map.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv dashboard.png docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update haze dashboard data [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push failed, retrying ($i)..."
            sleep $((i * 3))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
