name: Singapore Haze Dashboard

on:
  schedule:
    - cron: "5 * * * *"  # hourly, 5 minutes past the hour
  workflow_dispatch: {}   # allows manual trigger, incl. from the GitHub mobile app

permissions:
  contents: write

concurrency:
  group: haze-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # continue-on-error for the same reason as the build step below: an
      # unexpected crash here (e.g. a network error not caught by
      # fetch_data.py's own retry logic) must never skip the commit step and
      # discard data already fetched earlier in this same run.
      - name: Fetch latest PM2.5 + PSI data
        id: fetch_data
        continue-on-error: true
        run: python scripts/fetch_data.py

      - name: Build dashboard (docs/data.json + docs/index.html)
        id: build_dashboard
        continue-on-error: true
        run: python scripts/build_dashboard.py

      # A build step failing must never block committing data that fetch_data.py
      # already fetched successfully -- that data is real and shouldn't be
      # thrown away because e.g. a chart-rendering bug crashed afterward. So
      # the build step above is continue-on-error, we commit whatever files
      # exist here regardless, and only *afterward* does this job fail (below)
      # so the run still shows red and gets noticed.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch --quiet dashboard.png docs/dashboard.png
          for f in data/history.csv docs/index.html docs/data.json docs/.nojekyll; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update haze dashboard data [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push failed, retrying ($i)..."
            sleep $((i * 3))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

      - name: Fail job if the fetch or build step failed
        if: steps.fetch_data.outcome == 'failure' || steps.build_dashboard.outcome == 'failure'
        run: |
          echo "The fetch and/or build step failed; whatever data existed was still committed above. See that step's log."
          exit 1
